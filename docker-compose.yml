services:
  web:
    build:
      context: .
      args:
        # Browser requests /api on this container; nginx proxies to the host.
        VITE_API_URL: /api
    ports:
      - "8080:80"
    extra_hosts:
      # Makes host.docker.internal resolve on Linux as well.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
